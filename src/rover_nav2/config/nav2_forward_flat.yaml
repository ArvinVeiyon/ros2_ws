# Nav2 -- FORWARD-ONLY autonomy, FLAT SCAN ONLY. THIS IS THE ARMED-RUN CONFIG.
#
# Derived from nav2_forward.yaml on 2026-09-19. Four differences, all safety:
#
#   1. voxel_layer is OUT of both costmap plugin lists. Its parameter blocks are
#      left in place so G4 can re-enable it by name, but with it ACTIVE on
#      2026-09-17 Nav2 commanded a SUSTAINED MAX-RATE SPIN.
#      NEVER ARM WITH voxel_layer ENABLED.
#   2. PreferForward + Twirling critics added -- see the note at the critic
#      scales below.
#   3. max_vel_theta 0.5 -> 1.0 rad/s, and the velocity smoother's theta limit
#      with it. THEY MUST MOVE TOGETHER.
#   4. Why 1.0 and not more: autonav_mode clamps |yaw| to kMaxYawRate = 1.0
#      rad/s in its /cmd_vel callback (mode.hpp), so anything above 1.0 is
#      silently clipped downstream and the config would be lying.
#
# THE REASON FOR (3), measured, not assumed: this skid-steer has a FRICTION
# DEADBAND. steer < ~0.45 produces NO rotation at all; above it,
# yaw ~= 7.6 * (steer - 0.40). Minimum achievable yaw rate is ~0.67 rad/s
# (docs/rover_yaw_response.md). The old 0.5 ceiling was BELOW that floor, so
# every turn Nav2 asked for was a grind, not a rotation.
#
# Original header follows.
#
# Nav2 -- FORWARD-ONLY autonomy on the Gemini 336L depth camera alone (no lidar).
#
# This config is deliberately narrow. It is not a general Nav2 setup that has
# been trimmed; it is built around three hard facts about this sensor, and every
# unusual value below traces back to one of them.
#
#   1. The camera sees 92 deg (-46..+46). There is NO rear or side sensing at
#      all. Anything the rover has not driven past is unknown, and anything it
#      HAS driven past is remembered rather than observed -- stale the moment
#      something moves.
#   2. range_min is 0.30 m, and the front bumper sits 0.337 m ahead of the scan
#      origin. There is a blind collar right at the nose.
#   3. /scan is a single horizontal SLICE of the depth image, not a 3D cloud.
#      Table tops, overhangs, thresholds and cables are invisible unless they
#      intersect that one band.
#
# Consequences, which are the whole reason this file differs from stock Nav2:
#   * NO SLAM and NO map frame. Both costmaps run in `odom` with rolling
#     windows. Goals are short and ahead. Odom drift is irrelevant over a few
#     metres and this removes a whole subsystem that a 92 deg scan would do
#     badly anyway (scan matching needs wide FOV).
#   * SPIN and BACK_UP recoveries are REMOVED, not merely discouraged. Both
#     drive the rover through space it has never observed. With no rear sensor
#     they are the single most likely way to hit something.
#   * Reverse is forbidden (min_vel_x = 0.0) for the same reason.
#
# CPU: this Pi 5 has 4 cores already carrying camera + scan + odometry, and the
# stack has a documented starvation failure mode. Frequencies here are well
# below Nav2 defaults on purpose. DWB is chosen over MPPI for the same reason --
# MPPI's sampling is far more expensive and there is no headroom for it.

bt_navigator:
  ros__parameters:
    global_frame: odom          # NOT map -- there is no SLAM in this config
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # MUST be set explicitly. Nav2's default tree is
    # navigate_to_pose_w_replanning_and_recovery.xml, which calls the `spin`
    # action -- and behavior_plugins below is ["wait"] on purpose, so no spin
    # server exists. bt_navigator then fails to ACTIVATE and the lifecycle
    # manager aborts the whole bringup. Found 2026-09-17, first Phase 0.
    # This tree is ComputePathToPose + FollowPath on a replan timer, with no
    # recovery actions at all, which is what this config's sensing supports.
    default_nav_to_pose_bt_xml: "/opt/ros/jazzy/share/nav2_bt_navigator/behavior_trees/navigate_w_replanning_time.xml"

controller_server:
  ros__parameters:
    # 10 Hz, not the stock 20 -- CPU headroom on a 4-core Pi already running
    # the camera, depth->scan and odometry.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.005
    min_y_velocity_threshold: 0.5     # differential drive: no lateral motion
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15   # 2026-09-19: 0.30 in 15 s is too strict for a rover that slows near the goal
      movement_time_allowance: 25.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30     # 2026-09-19: odom under-reads ~7% at the low mean speed a goal ends at
      # Loose yaw tolerance on purpose: tightening it makes the rover rotate in
      # place at the goal to "finish", which is exactly the blind manoeuvre this
      # config exists to avoid.
      yaw_goal_tolerance: 3.14    # 2026-09-19: ignore final heading. 0.50 made DWB rotate IN PLACE at
                                  # the goal -- the one manoeuvre this rover cannot do -- so it stalled
                                  # and the progress checker aborted 0.24 m short after a GOOD avoidance.
      stateful: True

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True

      # Speed limits use REAL m/s. They only became meaningful on 2026-08-01,
      # when erpm_to_ms was corrected by 12.2x -- before that /odom under-read
      # so badly that any limit compared against it permitted far more speed
      # than intended.
      min_vel_x: 0.0            # NO REVERSE -- nothing sees behind the rover
      max_vel_x: 0.35     # 2026-09-19: operator asked for a little more throttle
      max_speed_xy: 0.35
      min_speed_xy: 0.0
      min_vel_y: 0.0
      max_vel_y: 0.0
      # CORRECTED 2026-09-19. The old note here said yaw was "kept modest"
      # because the ~21x runaway of 2026-07-29 was unexplained and
      # RO_YAW_RATE_P was 0.05. Both are out of date: the runaway was
      # diagnosed as INTEGRAL WINDUP ACROSS THE FRICTION DEADBAND and killed
      # by RO_YAW_RATE_I = 0 (do NOT restore it), and P reads 0.08 on the FC.
      # 0.5 rad/s was not "modest", it was BELOW the 0.67 rad/s the vehicle can
      # actually produce -- the rover ground in place instead of turning.
      max_vel_theta: 0.7     # 2026-09-19: it slammed to the 1.0 clamp on 121/133 samples and cut the corner
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_theta: 1.0
      decel_lim_x: -0.5
      decel_lim_theta: -1.0

      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      # 2026-09-19 INVESTIGATION (reverted to 2.0 -- the fix is NOT yet known):
      # 2.0 s x 0.25 m/s = a 0.50 m horizon, but the global
      # plan around an obstacle does not diverge until ~0.9-1.1 m ahead. DWB
      # therefore scored 'straight' as optimal, drove until the collision reflex
      # blocked it at 0.69 m, and the goal aborted on 'failed to make progress'.
      # Tried 4.0 (0.88 m reach) and 6.0: DWB still chose a DEAD STRAIGHT
      # trajectory and avoided the obstacle by SLOWING DOWN instead of turning
      # (chosen speed fell to ~0.14 m/s). So the horizon is not the whole story.
      # NB sim_time is read at initialise -- a runtime param set does NOT apply.
      sim_time: 2.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.3
      short_circuit_trajectory_evaluation: True

      # 2026-09-19 (evening): PreferForward + Twirling REMOVED for this test.
      # They were added the same morning for blocker 3 and never validly tested --
      # every attempt used a runtime param set, which DWB ignores. This is the
      # stock critic set, i.e. the constraint I introduced, lifted.
      # 2026-09-19 (late): ObstacleFootprint ADDED after a BODY-SIDE COLLISION.
      # BaseObstacle scores only the robot's CENTRE POINT against the costmap --
      # it plans as if the rover had no length and no width. The centre cleared
      # the obstacle; the 0.73 m body, swinging its 0.385 m REAR OVERHANG as it
      # turned back toward the goal, did not. ObstacleFootprint scores the actual
      # footprint polygon swept along each trajectory, which is what this rover
      # needs: it has NO SIDE SENSING, so the reflex cannot catch a flank strike.
      # 2026-09-19 (late): PreferForward RE-ADDED at 15 after a pivot-in-place
      # failure (159/260 samples rotating, 0.14 m travelled, goal aborted).
      # THE TWO CRITICS DO DIFFERENT JOBS AND MUST NOT BE LUMPED TOGETHER:
      #   PreferForward penalises ROTATING IN PLACE and REVERSING  <- the guard we need
      #   Twirling      penalises ALL yaw, including the useful arc <- this was what
      #                 stopped every turn; it stays OUT.
      # THE CONFIGURATION T3 PASSED ON, 2026-09-19. Restored verbatim.
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint",
                "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      ObstacleFootprint.scale: 32.0
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.20
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.20
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0
      # ADDED 2026-09-19 -- blocker 3: DWB will command in-place rotation when
      # it cannot go forward, and this rover has NO rear or side sensing, so a
      # spin drives it through space nothing on it can see. Both critics are
      # stock dwb_critics plugins, already built here.
      #   PreferForward penalises trajectories with |x| < strafe_x while
      #   |theta| > strafe_theta -- i.e. rotating on the spot -- and anything
      #   with x < 0. Twirling penalises |theta| generally.
      # These are FIRST-CUT weights, deliberately strong but not infinite: if
      # rotation is genuinely the only option DWB can still pick it, and T4's
      # criterion is that it does NOT. Re-tune against the T4 /cmd_vel log.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      # CORRECTED 2026-08-01. The old `robot_radius: 0.30` did NOT enclose the
      # vehicle. It was the half-diagonal of the 0.43 m WHEELBASE by a 0.405 m
      # plate width, but neither is the body: the top plate is 0.730 x 0.450 m
      # (docs/rover_autonav_requirements.md:75 supersedes 0.405), and it sits
      # 0.345 m forward / 0.385 m back of base_link, which is the rotation
      # centre. Circumscribing radius is sqrt(0.385^2 + 0.225^2) = 0.446 m, so at
      # 0.30 most of the rover was outside its own footprint and Nav2 would plan
      # its bodywork through obstacles.
      #
      # A rectangle rather than a 0.45 m circle: the body is 0.730 x 0.450, so a
      # circumscribing circle is twice the true half-width laterally and would
      # refuse doorways and gaps the rover physically fits. Nav2 handles polygon
      # footprints for rotation correctly; the cost is a little more inflation
      # maths, which is worth it at these clearances.
      footprint: "[[0.345, 0.225], [0.345, -0.225], [-0.385, -0.225], [-0.385, 0.225]]"
      # voxel_layer carries the 3D information; obstacle_layer keeps the flat
      # /scan as an independent second source. Two sources on purpose: if the
      # point-cloud path stalls or the height band is wrong, the flat scan still
      # marks obstacles. A single perception path with no fallback is how a
      # costmap ends up confidently empty.
      plugins: ["obstacle_layer", "inflation_layer"]   # voxel OFF -- see header

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False       # costs CPU and bandwidth; enable to debug
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10                   # 10 x 0.05 = 0.5 m of vertical envelope
        max_obstacle_height: 0.45      # above this the rover drives underneath
        mark_threshold: 0
        combination_method: 1
        footprint_clearing_enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/depth/points
          # The cloud is published in camera_depth_optical_frame, not
          # camera_link. Left empty so nav2 uses the message's own frame and
          # raytracing originates where the sensor actually is.
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # MEASURED 2026-08-01: the floor sits at z = 0.043-0.093 m in
          # base_link, not at 0 -- base_link is ~5 cm above the ground. A
          # min_obstacle_height at or below that marks the FLOOR as lethal in
          # every visible cell and the rover refuses to move at all. 0.12 clears
          # the measured floor by ~3 cm, at the cost of missing obstacles under
          # ~12 cm. Re-validate in an open corridor: pitch calibration error
          # tilts the floor in base_link and can cross this threshold at range.
          min_obstacle_height: 0.12
          max_obstacle_height: 0.45
          obstacle_max_range: 3.0      # depth quality falls off well before 5 m
          # The camera sees the rover's own front plate at 0.305-0.331 m
          # (measured, 1982 points). Below 0.40 m every observation is the
          # vehicle itself, which would mark its own footprint lethal forever.
          obstacle_min_range: 0.40
          raytrace_max_range: 3.5
          raytrace_min_range: 0.40
          inf_is_valid: False

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        # footprint_clearing_enabled matters more than usual here: with a 92 deg
        # FOV the rover cannot re-observe cells beside itself, so without this a
        # spurious reading next to the body would persist and trap it.
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: camera_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          # Kept inside the camera's usable band. range_max is 5.0 m but depth
          # quality falls off well before that.
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0
        # Generous relative to the 0.30 m radius: the blind collar inside 0.30 m
        # means the rover cannot see an obstacle it is about to touch, so the
        # margin has to be carried in the costmap instead of the sensor.
        inflation_radius: 0.55

      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      # Rolling window in `odom`, NOT a static map. Without SLAM there is no
      # map->odom transform, so the "global" planner is really a medium-range
      # local planner. That is the correct scope for a forward-only test.
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      # Same correction as the local costmap above: 0.30 did not enclose the
      # 0.730 x 0.450 m body about base_link. Kept identical to the local
      # footprint on purpose -- a global planner working to a smaller footprint
      # than the controller produces plans the controller then refuses.
      footprint: "[[0.345, 0.225], [0.345, -0.225], [-0.385, -0.225], [-0.385, 0.225]]"
      track_unknown_space: false   # unknown treated as free: with 92 deg FOV
                                   # almost everything is unknown, and treating
                                   # it as lethal would refuse every plan
      # voxel_layer carries the 3D information; obstacle_layer keeps the flat
      # /scan as an independent second source. Two sources on purpose: if the
      # point-cloud path stalls or the height band is wrong, the flat scan still
      # marks obstacles. A single perception path with no fallback is how a
      # costmap ends up confidently empty.
      plugins: ["obstacle_layer", "inflation_layer"]   # voxel OFF -- see header

      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: False       # costs CPU and bandwidth; enable to debug
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 10                   # 10 x 0.05 = 0.5 m of vertical envelope
        max_obstacle_height: 0.45      # above this the rover drives underneath
        mark_threshold: 0
        combination_method: 1
        footprint_clearing_enabled: True
        observation_sources: pointcloud
        pointcloud:
          topic: /camera/depth/points
          # The cloud is published in camera_depth_optical_frame, not
          # camera_link. Left empty so nav2 uses the message's own frame and
          # raytracing originates where the sensor actually is.
          sensor_frame: ""
          data_type: "PointCloud2"
          clearing: True
          marking: True
          # MEASURED 2026-08-01: the floor sits at z = 0.043-0.093 m in
          # base_link, not at 0 -- base_link is ~5 cm above the ground. A
          # min_obstacle_height at or below that marks the FLOOR as lethal in
          # every visible cell and the rover refuses to move at all. 0.12 clears
          # the measured floor by ~3 cm, at the cost of missing obstacles under
          # ~12 cm. Re-validate in an open corridor: pitch calibration error
          # tilts the floor in base_link and can cross this threshold at range.
          min_obstacle_height: 0.12
          max_obstacle_height: 0.45
          obstacle_max_range: 3.0      # depth quality falls off well before 5 m
          # The camera sees the rover's own front plate at 0.305-0.331 m
          # (measured, 1982 points). Below 0.40 m every observation is the
          # vehicle itself, which would mark its own footprint lethal forever.
          obstacle_min_range: 0.40
          raytrace_max_range: 3.5
          raytrace_min_range: 0.40
          inf_is_valid: False

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        footprint_clearing_enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: camera_link
          data_type: "LaserScan"
          clearing: True
          marking: True
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: False

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0    # low: short goals, and CPU is scarce
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.30
      use_astar: false
      allow_unknown: true              # must be true -- see track_unknown_space

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # SPIN and BACK_UP ARE DELIBERATELY ABSENT.
    # Stock Nav2 lists ["spin","backup","drive_on_heading","wait"]. Both spin and
    # backup move the rover through space no sensor on this vehicle has ever
    # observed. With a 92 deg forward-only camera they are not recoveries, they
    # are collisions waiting for a trigger. Restore them only when there is
    # rear/side sensing (STL-19).
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 10.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    # Publishes geometry_msgs/Twist on /cmd_vel, which is exactly what
    # autonav_mode subscribes to -- no adapter needed on Nav2 1.3.12.
    max_velocity: [0.35, 0.0, 1.0]   # must track max_vel_x or the smoother clamps it back
    min_velocity: [0.0, 0.0, -1.0]     # x floor 0.0 => reverse stays forbidden
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: "/odom"
    odom_duration: 0.1
