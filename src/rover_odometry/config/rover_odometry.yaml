# ⚠️⚠️ THIS FILE IS NOT LOADED AT RUNTIME (noted 2026-08-09).
# rover-camera.service runs `ros2 run rover_odometry wheel_odometry_node` with NO
# --params-file, so the values that actually take effect are the declare_parameter
# DEFAULTS in wheel_odometry_node.py. Editing this file alone changes NOTHING.
# Keep the two in sync, and change the node's defaults when you want a new value
# to take effect — or add --params-file to the unit.
wheel_odometry_node:
  ros__parameters:
    # Wheel/ESC mapping — verified 2026-07-19 (hand-spin test, all wheels forward)
    left_addresses: [11, 13]
    right_addresses: [10, 12]
    wheel_addresses: [10, 11, 12, 13]
    wheel_signs: [-1.0, 1.0, 1.0, 1.0]   # only addr 10 reports inverted ERPM

    # MEASURED 2026-08-01 — was 0.000380, which was ~12.2x TOO SMALL.
    #
    # The old value came from assumed geometry, pi*0.1524/(7*3*60), i.e. 6"
    # wheels, 7 pole pairs, 3:1 gearing => pole_pairs*gear_ratio = 21. Measured
    # directly, that product is ~1.75, not 21, so the assumed drivetrain is
    # simply not this drivetrain.
    #
    # Method: the rover was pushed BY HAND through exactly 5 counted wheel
    # revolutions while integrating ERPM from /fmu/out/esc_status. A hand push
    # has no wheel slip and needs no tape measure, and the wheel diameter
    # cancels out of the ratio entirely:
    #     pole_pairs * gear_ratio = ERPM_seconds / (60 * revolutions)
    #                             = 516.7 / (60 * 5) = 1.722
    #     erpm_to_ms = 5 * pi * 0.1524 / 516.7 = 0.004633
    # A powered 2.13 m tape-measured drive agreed independently at 1.788 /
    # 0.004463 (it carries tape error and a little slip, both of which bias it
    # low), so the two methods agree to within 4%.
    #
    # The earlier ">=2.3x low" estimate was derived from a skid-steer spin and
    # was only ever a LOWER bound -- scrub makes wheels turn far more than the
    # achieved rotation implies. The real slip factor in that spin was ~5x.
    # Tool: tools/odom_scale_measure.py --revs 5
    erpm_to_ms: 0.004633
    # MEASURED 2026-07-21: 0.31 m, left hub centre to right hub centre.
    # Was 0.43 until then -- that figure is the WHEELBASE (front hub to rear hub),
    # not the track, and it under-reported every yaw rate by ~28% (0.31/0.43).
    track_width: 0.31            # m, LEFT-to-RIGHT wheel center distance

    # RE-MEASURED 2026-08-01 — was 40.0, which is far too coarse now.
    # 40 ERPM was chosen when the scale was believed to be 0.000380, making it a
    # harmless 0.015 m/s. At the real 0.004633 the SAME 40 ERPM is 0.185 m/s --
    # it would have silently swallowed most of the speed range Nav2 uses for
    # fine positioning, while looking like a sensible noise gate.
    # Standstill noise re-measured at 2930 samples per wheel, all four wheels:
    # min 0, max 0, i.e. NO jitter at all. The "+/-35 ERPM" note from 2026-07-19
    # does not reproduce. 5 ERPM (0.023 m/s) keeps a token guard.
    # ⚠️ Re-check this ARMED — motors dithering to hold position may inject
    # jitter that idle disarmed motors do not.
    deadband_erpm: 5.0

    # Staleness: per-ESC sample older than this is treated as missing
    esc_timeout: 0.30            # s

    # Heading source: 'camera_gyro' | 'gyro' | 'wheels'.
    #
    # ⛔ 'wheels' CANNOT WORK and is a diagnostic only. This is a skid-steer: it
    # turns ONLY by making all four tyres scrub sideways, so (v_right-v_left)/track
    # is measuring a quantity the wheels cannot observe.
    #
    # ⛔ 'gyro' (FC EKF attitude) WAS the default until 2026-08-09 and is now a
    # FALLBACK ONLY. Measured against a wall (RANSAC line fit on /scan, ±1 mm /
    # ±0.26 deg) with the rover VERIFIED STATIONARY, the FC invented:
    #     -18.88 deg over 111 s after a drive      (-0.170 deg/s)
    #     +23.23 deg over  21 s after a turn       (+1.106 deg/s)
    #     +27.1  deg total across one 4-min session
    # It is ERRATIC, not biased — the sign flips — and it is NOT proportional to
    # motor effort (0.341 m/s gave +0.54 deg phantom yaw where 0.364 m/s gave
    # -8.28 deg), so no gain or offset can compensate it. Root cause unknown.
    # EKF2_MAG_TYPE=1 (magnetometer in use) is the leading suspect but the
    # disable test was never run, and the fault is too intermittent for one run
    # to prove anything either way.
    #
    # ✅ 'camera_gyro' integrates the Gemini 336L gyro (/camera/gyro/sample,
    # 195 Hz), rotated into base_link via TF. Measured the same day:
    #     bias                     +0.72 deg/s  (large, but REMOVABLE)
    #     bias stability, cold      0.0028 deg/s
    #     bias stability, hot       0.0015 deg/s  <- driving does NOT disturb it
    #     scale error               -0.38% at 8.3 deg/s (2 full circles vs wall)
    # ⇒ ~1 deg of heading error over a 263 s mapping run, against tens to
    # hundreds from the FC.
    #
    # ⚠️ SCALE IS RATE-DEPENDENT: -0.38% at 8.3 deg/s, -1.17% at 21.8 deg/s,
    # -4.53% at 32.7 deg/s. MAP WITH SLOW, PAUSED TURNS (tap, full stop, pause
    # 3-4 s). This may be an artefact of the measuring probe rather than the
    # sensor — that probe integrated on arrival time, whereas the node integrates
    # header.stamp deltas and refuses to integrate across gaps. Not yet retested.
    #
    # ⚠️ This makes odometry depend on rover-camera, which degrades SILENTLY
    # (colour rate decays over ~1.5 h; a restart cures it). Staleness falls back
    # to 'gyro' then 'wheels', with a loud log line each time.
    yaw_source: camera_gyro
    attitude_timeout: 0.5        # s, older than this = stale, fall back
    camera_gyro_topic: /camera/gyro/sample
    camera_gyro_frame: camera_gyro_optical_frame
    camera_gyro_timeout: 0.3     # s; at 195 Hz that is ~58 missed samples
    camera_gyro_max_gap: 0.05    # s; larger stamp gaps are counted, NOT integrated
    camera_bias_window: 12.0     # s of at-rest samples in the rolling bias mean
    camera_bias_min_samples: 400 # refuse to integrate on a thinner estimate

    # These VESCs doze at rest (only addr 13 stays online, flags=8), which used to
    # silence /odom entirely whenever the rover stopped -- an L5 blocker, since
    # Nav2 and rover_ekf_bridge both need odometry to keep arriving. A dozing ESC
    # cannot be turning its wheel, so when every AWAKE wheel reads zero we publish
    # a genuine zero-velocity sample instead. Set false to restore the old skip.
    publish_at_rest: true

    frame_id: odom
    child_frame_id: base_link
    publish_tf: true
